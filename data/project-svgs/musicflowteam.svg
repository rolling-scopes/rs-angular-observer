<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><title>MusicFlowTeam</title><desc>A musical note dissolving into a flowing river of sound — note head as source, stem bending into a current of waves.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1340"/><stop offset="1" stop-color="#0a0820"/></linearGradient><linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff4f8b"/><stop offset="0.5" stop-color="#ff9d4d"/><stop offset="1" stop-color="#ffd66e"/></linearGradient><radialGradient id="note" cx="0.4" cy="0.4" r="0.7"><stop offset="0" stop-color="#ffd66e"/><stop offset="0.6" stop-color="#ff4f8b"/><stop offset="1" stop-color="#c8265f"/></radialGradient></defs><rect width="1000" height="1000" fill="url(#bg)"/><g fill="none" stroke="url(#flow)" stroke-linecap="round"><path d="M 360 360 Q 480 280 600 360 T 900 380" stroke-width="14" opacity="0.45"/><path d="M 320 460 Q 500 360 680 460 T 940 480" stroke-width="18"/><path d="M 300 560 Q 520 440 740 560 T 960 580" stroke-width="22"/><path d="M 320 660 Q 540 540 760 660 T 960 680" stroke-width="18"/><path d="M 360 760 Q 560 660 760 760 T 940 780" stroke-width="14" opacity="0.55"/><path d="M 420 850 Q 600 780 780 850" stroke-width="9" opacity="0.4"/></g><g><line x1="295" y1="180" x2="295" y2="560" stroke="#ffd66e" stroke-width="22" stroke-linecap="round"/><path d="M 295 180 Q 420 200 500 140 Q 440 260 305 250 Z" fill="#ff9d4d"/><ellipse cx="240" cy="580" rx="105" ry="78" fill="url(#note)" transform="rotate(-22 240 580)"/></g><g fill="#ffd66e"><circle cx="850" cy="320" r="6" opacity="0.7"/><circle cx="780" cy="250" r="4" opacity="0.5"/><circle cx="910" cy="540" r="5" opacity="0.6"/><circle cx="880" cy="720" r="4" opacity="0.5"/><circle cx="820" cy="820" r="6" opacity="0.7"/></g></svg>
