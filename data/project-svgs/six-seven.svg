<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><title>six seven</title><desc>A bold price tag tilted slightly, stamped with "6 7" — the team's name reading as the price on the catalog they're building.</desc><rect width="1000" height="1000" fill="#0e1726"/><g transform="rotate(-6 500 500)"><path d="M 190 160 Q 110 80 95 -10" stroke="#fde68a" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M 260 80 L 920 80 L 920 920 L 80 920 L 80 260 Z" fill="#ef4444" stroke="#fde68a" stroke-width="12" stroke-linejoin="round"/><circle cx="215" cy="215" r="40" fill="#0e1726" stroke="#fde68a" stroke-width="8"/><text x="385" y="690" font-family="Georgia, 'Times New Roman', serif" font-size="560" font-weight="900" font-style="italic" fill="#fef3c7" text-anchor="middle">6</text><text x="655" y="690" font-family="Georgia, 'Times New Roman', serif" font-size="560" font-weight="900" font-style="italic" fill="#fbbf24" text-anchor="middle">7</text></g></svg>
