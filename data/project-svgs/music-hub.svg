<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><title>music-hub</title><desc>A vinyl record reimagined as a hub — concentric grooves radiate from a bright center, with a single sound wave escaping outward.</desc><defs><radialGradient id="bg" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#2a1b3d"/><stop offset="100%" stop-color="#0d0820"/></radialGradient><radialGradient id="label" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ff8b3d"/><stop offset="100%" stop-color="#e63946"/></radialGradient></defs><rect width="1000" height="1000" fill="url(#bg)"/><circle cx="500" cy="500" r="380" fill="#111118"/><g fill="none" stroke="#1f1f2e" stroke-width="2"><circle cx="500" cy="500" r="360"/><circle cx="500" cy="500" r="340"/><circle cx="500" cy="500" r="320"/><circle cx="500" cy="500" r="300"/><circle cx="500" cy="500" r="280"/><circle cx="500" cy="500" r="260"/><circle cx="500" cy="500" r="240"/><circle cx="500" cy="500" r="220"/><circle cx="500" cy="500" r="200"/></g><g stroke="#3a2a5a" stroke-width="1" fill="none" opacity="0.6"><circle cx="500" cy="500" r="350"/><circle cx="500" cy="500" r="310"/><circle cx="500" cy="500" r="270"/><circle cx="500" cy="500" r="230"/></g><circle cx="500" cy="500" r="160" fill="url(#label)"/><circle cx="500" cy="500" r="160" fill="none" stroke="#fff2d8" stroke-width="2" opacity="0.4"/><g fill="none" stroke="#fff2d8" stroke-width="6" stroke-linecap="round"><path d="M 500 500 L 500 380"/><circle cx="500" cy="500" r="14" fill="#fff2d8"/></g><circle cx="500" cy="500" r="10" fill="#0d0820"/><g fill="none" stroke="#7ee8c4" stroke-width="8" stroke-linecap="round" opacity="0.95"><path d="M 720 500 Q 770 460 720 420"/><path d="M 780 500 Q 860 430 780 360"/><path d="M 840 500 Q 950 400 840 300"/></g><g fill="#ff8b3d"><circle cx="220" cy="280" r="6"/><circle cx="780" cy="760" r="5"/><circle cx="280" cy="780" r="4"/></g></svg>
