<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><title>404</title><desc>A playful 404 sign that became a shopping tag — the missing page found its product.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1530"/><stop offset="1" stop-color="#0d0a1f"/></linearGradient><linearGradient id="tag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b9d"/><stop offset="1" stop-color="#c33764"/></linearGradient></defs><rect width="1000" height="1000" fill="url(#bg)"/><g transform="translate(500 520) rotate(-12)"><path d="M -220 -240 L 180 -240 L 280 -140 L 280 240 L -220 240 Z" fill="url(#tag)" stroke="#ffd76b" stroke-width="6"/><circle cx="210" cy="-170" r="22" fill="#0d0a1f" stroke="#ffd76b" stroke-width="5"/><line x1="225" y1="-155" x2="320" y2="-60" stroke="#ffd76b" stroke-width="10" stroke-linecap="round"/><text x="30" y="80" font-family="Georgia, serif" font-size="240" font-weight="700" fill="#fff8e7" text-anchor="middle" letter-spacing="-8">404</text><text x="30" y="170" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#ffd76b" text-anchor="middle" letter-spacing="14">FOUND IT</text></g><circle cx="180" cy="220" r="6" fill="#ffd76b"/><circle cx="820" cy="180" r="4" fill="#ff6b9d"/><circle cx="860" cy="820" r="7" fill="#ffd76b"/><circle cx="140" cy="780" r="5" fill="#ff6b9d"/></svg>
